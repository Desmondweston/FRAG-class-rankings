<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BDO Node War & Siege Spec Ranker</title>
<style>
:root{--bg:#0d1015;--panel:#151a22;--panel2:#1b222d;--text:#f2f4f7;--muted:#9ba5b3;--accent:#d5a84b;--line:#303846}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at top,#1b2230,#0d1015 55%);color:var(--text);font-family:Inter,system-ui,-apple-system,sans-serif}
header{padding:28px 22px 18px;position:sticky;top:0;background:#0d1015ee;backdrop-filter:blur(12px);z-index:5;border-bottom:1px solid var(--line)}
h1{margin:0 0 5px;font-size:clamp(24px,4vw,38px)} .sub{color:var(--muted)}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.controls>*{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:10px 12px}
main{max-width:1500px;margin:auto;padding:22px}
.board{display:grid;grid-template-columns:repeat(4,minmax(250px,1fr));gap:16px}
.tier{background:#11161e;border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:160px}
.tier h2{margin:0;padding:12px 15px;background:var(--panel2);font-size:18px}.drop{padding:10px;min-height:120px}
.card{display:grid;grid-template-columns:62px 1fr auto;gap:11px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;cursor:grab}
.thumb{width:62px;height:62px;border-radius:8px;object-fit:cover;background:#272e39}.name{font-weight:750}.spec{font-size:12px;color:var(--accent);text-transform:uppercase;letter-spacing:.06em}.diff{font-size:12px;color:var(--muted)}
.stars{display:flex;gap:2px}.star{font-size:18px;cursor:pointer;color:#4c5562}.star.on{color:#f3c64b}
.empty{color:#687282;text-align:center;padding:25px}.add{margin-top:14px;padding:10px 12px;border:1px dashed #586274;border-radius:9px;background:transparent;color:var(--text);cursor:pointer}
.modal{position:fixed;inset:0;background:#0009;display:none;place-items:center;z-index:10}.modal.open{display:grid}.box{width:min(560px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px}.box input,.box textarea,.box select{width:100%;margin:7px 0 14px;padding:10px;border-radius:8px;background:#0e131a;border:1px solid var(--line);color:white}.row{display:flex;gap:10px}.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--accent);color:#17130a;font-weight:800;cursor:pointer}.secondary{background:#303846;color:white}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,minmax(250px,1fr))}}@media(max-width:650px){.board{grid-template-columns:1fr}main{padding:12px}.card{grid-template-columns:52px 1fr auto}.thumb{width:52px;height:52px}}
</style>
</head>
<body>
<header>
<h1>BDO Uncapped Node War & Siege Ranker</h1>
<div class="sub">Rank every class/spec independently. Drag cards between tiers and score practical difficulty from 1–5 stars.</div>
<div class="controls">
<input id="search" placeholder="Search class/spec…" oninput="render()">
<select id="mode" onchange="render()"><option value="all">All Modes</option><option>Uncapped Node War</option><option>Siege</option></select>
<select id="filter" onchange="render()"><option value="all">All Specs</option><option>Succession</option><option>Awakening</option><option>Ascension</option></select>
<button onclick="exportData()">Export Rankings</button><button onclick="document.getElementById('file').click()">Import Rankings</button>
<input id="file" type="file" accept=".json" hidden onchange="importData(event)">
</div>
</header>
<main><div id="board" class="board"></div><button class="add" onclick="openModal()">+ Add custom class/spec</button></main>

<div id="modal" class="modal"><div class="box">
<h2>Add / edit spec</h2>
<label>Class<input id="mClass"></label>
<label>Spec<select id="mSpec"><option>Succession</option><option>Awakening</option><option>Ascension</option></select></label>
<label>Image URL<input id="mImage" placeholder="Paste a direct image URL"></label>
<label>Notes<textarea id="mNotes" rows="3"></textarea></label>
<div class="row"><button class="btn" onclick="saveCustom()">Save</button><button class="btn secondary" onclick="closeModal()">Cancel</button></div>
</div></div>

let cards = JSON.parse(localStorage.getItem('bdoRanker') || 'null') || initial;
const tiers=["S","A","B","C","D","Unranked"];
function save(){localStorage.setItem('bdoRanker',JSON.stringify(cards))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function stars(n,id){return [1,2,3,4,5].map(i=>`<span class="star ${i<=n?'on':''}" onclick="event.stopPropagation();rate('${id}',${i})">★</span>`).join('')}
function rate(id,n){let x=cards.find(c=>c.id===id);x.difficulty=n;save();render()}
function move(id,tier){let x=cards.find(c=>c.id===id);x.rank=tier;save();render()}
function render(){
 let q=document.getElementById('search').value.toLowerCase(), f=document.getElementById('filter').value;
 let visible=cards.filter(c=>(f==='all'||c.spec===f)&&(`${c.class} ${c.spec}`).toLowerCase().includes(q));
 document.getElementById('board').innerHTML=tiers.map(t=>`<section class="tier" ondragover="event.preventDefault()" ondrop="move(event,'${t}')">
 <h2>${t}</h2><div class="drop">${visible.filter(c=>c.rank===t).map(c=>`
 <div class="card" draggable="true" ondragstart="event.dataTransfer.setData('id','${c.id}')" onclick="edit('${c.id}')">
 <img class="thumb" src="${esc(c.image||'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#272e39"/><text x="50%" y="52%" text-anchor="middle" fill="#aeb7c4" font-size="12">IMAGE</text></svg>'))}" onerror="this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100%" height="100%" fill="#272e39"/><text x="50%" y="52%" text-anchor="middle" fill="#aeb7c4" font-size="12">IMAGE</text></svg>')">
 <div><div class="name">${esc(c.class)}</div><div class="spec">${esc(c.spec)}</div><div class="stars">${stars(c.difficulty,c.id)}</div><div class="diff">${c.difficulty?c.difficulty+'/5 difficulty':'Not rated'}</div></div>
 <div>↕</div></div>`).join('')||'<div class="empty">Drop specs here</div>'}</div></section>`).join('')
}
function move(e,t){let id=e.dataTransfer.getData('id');move(id,t)}
function edit(id){let c=cards.find(x=>x.id===id);document.getElementById('mClass').value=c.class;document.getElementById('mSpec').value=c.spec;document.getElementById('mImage').value=c.image||'';document.getElementById('mNotes').value=c.notes||'';document.getElementById('modal').classList.add('open');document.getElementById('modal').dataset.id=id}
function openModal(){['mClass','mImage','mNotes'].forEach(x=>document.getElementById(x).value='');document.getElementById('mSpec').value='Succession';document.getElementById('modal').dataset.id='';document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open')}
function saveCustom(){let id=document.getElementById('modal').dataset.id||crypto.randomUUID();let old=cards.find(x=>x.id===id);let x={id,class:document.getElementById('mClass').value.trim(),spec:document.getElementById('mSpec').value,image:document.getElementById('mImage').value.trim(),notes:document.getElementById('mNotes').value.trim(),rank:old?.rank||'Unranked',difficulty:old?.difficulty||0};if(!x.class)return; if(old)Object.assign(old,x);else cards.push(x);save();closeModal();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(cards,null,2)],{type:'application/json'}));a.download='bdo-rankings.json';a.click()}
function importData(e){let r=new FileReader();r.onload=()=>{try{cards=JSON.parse(r.result);save();render()}catch{alert('Invalid JSON')}};r.readAsText(e.target.files[0])}
render()

</body></html>
